server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SSE / API 反向代理:关闭缓冲,长连接透传
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
